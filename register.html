<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تۆمارکردن و دەستکاریکردنی قوتابی - سیستەمی غایبات</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .top-bar {
            background: #16324f; padding: 10px 24px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: center; font-size: 13px;
            color: #cfe4f0;
        }
        .top-bar a { color: #8fc7e3; text-decoration: none; margin-inline-start: 14px; }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar .role-tag {
            background: #2ecc71; color: #0f2740; font-size: 11px; font-weight: bold;
            padding: 2px 8px; border-radius: 10px; margin-left: 6px;
        }
        .top-bar .role-tag.admin { background: #f1c40f; }
        .top-bar button {
            background: none; border: 1px solid #445; color: #ccc; padding: 4px 12px;
            border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px;
        }
        .top-bar button:hover { background: #c0392b; border-color: #c0392b; color: white; }
        .page-wrap { padding: 20px; }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2, h3, h4 { color: #2c3e50; }

        input[type="text"], input[type="file"], select {
            width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;
        }
        
        /* دابەشکردنی فرمەکە بۆ دوو ستوون (فۆرم لە چەپ و کامێرا لە ڕاست و گەورە) */
        .form-layout {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .form-fields {
            flex: 1;
            min-width: 320px;
        }
        .camera-wrapper-section {
            width: 380px;
            text-align: center;
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e1e8ed;
        }

        button { padding: 6px 12px; border: none; cursor: pointer; border-radius: 4px; margin: 2px; }
        .btn-menu {
            background-color: #34495e; color: white; padding: 10px 20px; font-size: 14px;
            border: none; border-radius: 6px; cursor: pointer;
        }
        .btn-save { background: #27ae60; color: white; width: 100%; padding: 12px; font-size: 16px; margin-top: 15px; }
        .btn-cancel-edit { background: #95a5a6; color: white; width: 100%; padding: 10px; font-size: 14px; margin-top: 6px; display: none; }

        .edit-banner {
            display: none; background: #fff3cd; color: #7a5c00; padding: 8px 12px;
            border-radius: 5px; margin-bottom: 10px; font-size: 14px;
        }

        .img-preview { width: 180px; height: 180px; object-fit: cover; border-radius: 10px; display: none; margin: 10px auto; border: 2px solid #34495e; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        
        /* قەبارەی گەورەی کامێرا لەلای ڕاست */
        .webcam-container {
            position: relative;
            width: 100%;
            height: 320px;
            margin: 10px auto;
            overflow: hidden;
            border-radius: 10px;
            border: 2px solid #34495e;
            background: #000;
            display: none;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center center;
            transition: transform 0.1s ease;
        }

        /* بەشی دوگمەکانی Zoom In / Zoom Out */
        .zoom-controls {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 10px auto;
            background: #eef2f7;
            padding: 8px 15px;
            border-radius: 20px;
        }
        .btn-zoom {
            background-color: #2980b9;
            color: white;
            font-weight: bold;
            font-size: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
        }
        .btn-zoom:hover { background-color: #1c5980; }
        .zoom-value { font-size: 13px; font-weight: bold; width: 45px; text-align: center; }

        .card-scan-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .card-scan-row input#card-id { flex: 1; min-width: 160px; margin: 8px 0; }
        .card-scan-row button { white-space: nowrap; font-size: 13px; padding: 9px 12px; }
        .btn-scan-connect { background: #16a085; color: white; }
        .btn-scan-connect:hover { background: #128a71; }
        .btn-scan-disconnect { background: #e74c3c; color: white; }
        .scan-status { font-size: 12px; color: #888; margin: -4px 0 10px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>
            <span class="role-tag" id="role-tag">...</span>
            <span id="staff-name-label">چاوەڕوانبە...</span>
        </div>
        <div>
            <a href="index.html">🏠 پانێڵی بەڕێوەبەر</a>
            <a href="scanner.html">📡 سکانەر</a>
            <button id="btn-logout">چوونەدەرەوە</button>
        </div>
    </div>

    <div class="page-wrap">
        <div class="container">
            <h2>تۆمارکردن و دەستکاریکردنی قوتابی</h2>
            <div class="edit-banner" id="edit-banner">✏️ لە دۆخی دەستکاریکردنیت بۆ قوتابییەکی هەبوو</div>
            
            <form id="student-form">
                <div class="form-layout">
                    <!-- بەشی چەپ: خانەکانی زانیاری -->
                    <div class="form-fields">
                        <div class="card-scan-row">
                            <input type="text" id="card-id" placeholder="ژمارەی کارت (RFID)" required autocomplete="off">
                            <button type="button" id="btn-scan-connect" class="btn-scan-connect">📡 پەیوەستکردنی کارتخوێن</button>
                            <button type="button" id="btn-scan-disconnect" class="btn-scan-disconnect" style="display:none;">بڕینی پەیوەندی</button>
                        </div>
                        <div class="scan-status" id="scan-status">کارتخوێن پەیوەست نییە — دەتوانیت ژمارەی کارت بە دەست بنووسیت یان کارتخوێن پەیوەست بکەیت</div>
                        
                        <input type="text" id="student-name" placeholder="ناوی تەواو" required>
                        
                        <input type="text" id="student-class" list="classes-list" placeholder="پۆل (نموونە: 10/A)" required>
                        <datalist id="classes-list"></datalist>

                        <div style="margin-top: 15px;">
                            <label style="display:block; font-weight:bold; margin-bottom:6px;">هەڵبژاردنی وێنە لە فایلەوە:</label>
                            <input type="file" id="student-file" accept="image/*">
                        </div>

                        <button type="submit" class="btn-save">پاشکەوتکردن / نوێکردنەوە</button>
                        <button type="button" class="btn-cancel-edit" id="btn-cancel-edit">پاشگەزبوونەوە لە دەستکاریکردن</button>
                    </div>

                    <!-- بەشی ڕاست: کامێرا و زوم بە قەبارەی گەورە -->
                    <div class="camera-wrapper-section">
                        <label style="display:block; font-weight:bold; margin-bottom:6px; color:#2c3e50;">کامێرا و وێنەی ڕاستەوخۆ:</label>
                        
                        <div class="webcam-container" id="webcam-container">
                            <video id="webcam" autoplay playsinline></video>
                        </div>
                        
                        <!-- دوگمەکانی Zoom In و Zoom Out -->
                        <div class="zoom-controls" id="zoom-container">
                            <button type="button" class="btn-zoom" id="btn-zoom-out" title="زوم ئاوت">-</button>
                            <span class="zoom-value" id="zoom-val">1.0x</span>
                            <button type="button" class="btn-zoom" id="btn-zoom-in" title="زوم ئین">+</button>
                        </div>

                        <div style="margin-top: 10px;">
                            <button type="button" id="btn-capture" class="btn-menu">کردنەوەی کامێرا</button>
                            <button type="button" id="btn-take-pic" class="btn-menu" style="background-color: #27ae60; display:none;">گرتنی وێنە</button>
                        </div>
                        <canvas id="canvas" style="display:none;"></canvas>
                        
                        <img id="img-preview" class="img-preview" alt="وێنەی پێشبینیکراو">
                    </div>
                </div>
            </form>

            <!-- لیستی گشتی قوتابییان لە خوارەوە بە تەواوی شاردراوەتەوە (display: none) -->
            <div style="display: none;">
                <h3>لیستی گشتی قوتابییان بۆ دەستکاریکردن یان سڕینەوە</h3>
                <input type="text" id="student-search" placeholder="گەڕان بە ناو، پۆل یان ژمارەی کارت...">
                <table>
                    <thead>
                        <tr><th>کارت</th><th>ناو</th><th>پۆل</th><th>کردارەکان</th></tr>
                    </thead>
                    <tbody id="all-students-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { app } from "./firebase-config.js";
        import { requireStaffAuth, logout } from "./auth-guard.js";
        import { 
            getDatabase, ref, set, onValue, remove, update 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const db = getDatabase(app);
        const staff = await requireStaffAuth({ requireAdmin: true });
        
        document.getElementById('staff-name-label').innerText = staff.name;
        const roleTagEl = document.getElementById('role-tag');
        roleTagEl.innerText = 'بەڕێوەبەر';
        roleTagEl.classList.add('admin');
        document.getElementById('btn-logout').addEventListener('click', logout);

        let capturedImageBase64 = null;
        let editingCardId = null;
        let studentsCache = [];
        let webcamStream = null;
        let videoTrack = null;
        let currentZoomLevel = 1.0;

        const btnCapture = document.getElementById('btn-capture');
        const btnTakePic = document.getElementById('btn-take-pic');
        const webcamContainer = document.getElementById('webcam-container');
        const video = document.getElementById('webcam');
        const zoomContainer = document.getElementById('zoom-container');
        const zoomValDisplay = document.getElementById('zoom-val');
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');

        btnCapture.addEventListener('click', startWebcam);
        btnTakePic.addEventListener('click', takeSnapshot);

        async function startWebcam() {
            btnTakePic.style.display = 'inline-block';
            try {
                webcamStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = webcamStream;
                webcamContainer.style.display = 'block';
                zoomContainer.style.display = 'flex';

                videoTrack = webcamStream.getVideoTracks()[0];
                currentZoomLevel = 1.0;
                applyZoom(currentZoomLevel);
            } catch (e) {
                alert("نەتوانرا کامێرا بکرێتەوە: " + e.message);
            }
        }

        btnZoomIn.addEventListener('click', () => {
            if (currentZoomLevel < 3.0) {
                currentZoomLevel = parseFloat((currentZoomLevel + 0.2).toFixed(1));
                applyZoom(currentZoomLevel);
            }
        });

        btnZoomOut.addEventListener('click', () => {
            if (currentZoomLevel > 1.0) {
                currentZoomLevel = parseFloat((currentZoomLevel - 0.2).toFixed(1));
                applyZoom(currentZoomLevel);
            }
        });

        async function applyZoom(zoomVal) {
            zoomValDisplay.innerText = zoomVal.toFixed(1) + 'x';
            if (videoTrack && videoTrack.getCapabilities) {
                const capabilities = videoTrack.getCapabilities();
                if ('zoom' in capabilities) {
                    try {
                        const targetZoom = Math.min(Math.max(zoomVal, capabilities.zoom.min), capabilities.zoom.max);
                        await videoTrack.applyConstraints({ advanced: [{ zoom: targetZoom }] });
                    } catch (e) {
                        console.warn("Hardware zoom error:", e);
                    }
                }
            }
            video.style.transform = `scale(${zoomVal})`;
        }

        function takeSnapshot() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const vWidth = video.videoWidth;
            const vHeight = video.videoHeight;
            
            canvas.width = vWidth;
            canvas.height = vHeight;

            const cropWidth = vWidth / currentZoomLevel;
            const cropHeight = vHeight / currentZoomLevel;
            const startX = (vWidth - cropWidth) / 2;
            const startY = (vHeight - cropHeight) / 2;

            ctx.drawImage(video, startX, startY, cropWidth, cropHeight, 0, 0, vWidth, vHeight);
            
            capturedImageBase64 = canvas.toDataURL('image/jpeg');
            showPreview(capturedImageBase64);
            stopWebcam();
        }

        function stopWebcam() {
            if (webcamStream) {
                webcamStream.getTracks().forEach(t => t.stop());
                webcamStream = null;
                videoTrack = null;
            }
            webcamContainer.style.display = 'none';
            btnTakePic.style.display = 'none';
            zoomContainer.style.display = 'none';
        }

        function showPreview(src) {
            const img = document.getElementById('img-preview');
            img.src = src;
            img.style.display = 'block';
        }

        onValue(ref(db, 'students'), (snapshot) => {
            studentsCache = [];
            const uniqueClasses = new Set();

            if (snapshot.exists()) {
                const data = snapshot.val();
                Object.keys(data).forEach(id => {
                    const st = { cardId: id, ...data[id] };
                    studentsCache.push(st);
                    if (st.class) uniqueClasses.add(st.class.trim());
                });
            }
            
            renderStudentsTable(studentsCache);
            populateClassesDatalist(Array.from(uniqueClasses));
        });

        function populateClassesDatalist(classList) {
            const datalist = document.getElementById('classes-list');
            datalist.innerHTML = '';
            classList.sort().forEach(cls => {
                const option = document.createElement('option');
                option.value = cls;
                datalist.appendChild(option);
            });
        }

        function renderStudentsTable(list) {
            const tbody = document.getElementById('all-students-table-body');
            tbody.innerHTML = '';
            list.forEach(st => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${st.cardId}</td>
                    <td>${st.name}</td>
                    <td>${st.class}</td>
                    <td>
                        <button class="btn-edit" data-id="${st.cardId}">دەستکاری</button>
                        <button class="btn-delete" data-id="${st.cardId}">سڕینەوە</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            tbody.querySelectorAll('.btn-edit').forEach(btn => {
                btn.onclick = () => startEdit(btn.dataset.id);
            });
            tbody.querySelectorAll('.btn-delete').forEach(btn => {
                btn.onclick = () => deleteStudent(btn.dataset.id);
            });
        }

        function startEdit(cardId) {
            const st = studentsCache.find(s => s.cardId === cardId);
            if (!st) return;
            editingCardId = cardId;
            document.getElementById('card-id').value = st.cardId;
            document.getElementById('card-id').disabled = true;
            document.getElementById('student-name').value = st.name;
            document.getElementById('student-class').value = st.class;
            document.getElementById('edit-banner').style.display = 'block';
            document.getElementById('btn-cancel-edit').style.display = 'block';
            if (st.photo) showPreview(st.photo);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            editingCardId = null;
            const currentClassValue = document.getElementById('student-class').value;
            document.getElementById('student-form').reset();
            document.getElementById('student-class').value = currentClassValue;
            document.getElementById('card-id').disabled = false;
            document.getElementById('edit-banner').style.display = 'none';
            document.getElementById('btn-cancel-edit').style.display = 'none';
            document.getElementById('img-preview').style.display = 'none';
            capturedImageBase64 = null;
            stopWebcam();
            document.getElementById('card-id').focus();
        }

        document.getElementById('btn-cancel-edit').addEventListener('click', resetForm);

        async function deleteStudent(cardId) {
            if (confirm("دڵنیایت لە سڕینەوەی ئەم قوتابییە؟")) {
                await remove(ref(db, `students/${cardId}`));
            }
        }

        document.getElementById('student-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const cardId = document.getElementById('card-id').value.trim();
            const name = document.getElementById('student-name').value.trim();
            const cls = document.getElementById('student-class').value.trim();
            const fileInput = document.getElementById('student-file');

            let photoData = capturedImageBase64;

            if (!photoData && fileInput.files.length > 0) {
                photoData = await new PageReadHelper... // or standard reader
                photoData = await new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(fileInput.files[0]);
                });
            }

            const updates = { name: name, class: cls };
            if (photoData) updates.photo = photoData;

            if (editingCardId) {
                await update(ref(db, `students/${editingCardId}`), updates);
            } else {
                if (!photoData) updates.photo = "";
                await set(ref(db, `students/${cardId}`), updates);
            }

            resetForm();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تۆمارکردن و دەستکاریکردنی قوتابی - سیستەمی غایبات</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .top-bar {
            background: #16324f; padding: 10px 24px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: center; font-size: 13px;
            color: #cfe4f0;
        }
        .top-bar a { color: #8fc7e3; text-decoration: none; margin-inline-start: 14px; }
        .top-bar a:hover { text-decoration: underline; }
        .top-bar .role-tag {
            background: #f1c40f; color: #0f2740; font-size: 11px; font-weight: bold;
            padding: 2px 8px; border-radius: 10px; margin-left: 6px;
        }
        .top-bar button {
            background: none; border: 1px solid #445; color: #ccc; padding: 4px 12px;
            border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px;
        }
        .top-bar button:hover { background: #c0392b; border-color: #c0392b; color: white; }
        .page-wrap { padding: 20px; }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2, h3, h4 { color: #2c3e50; }

        input[type="text"], input[type="file"], select {
            width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;
        }
        button { padding: 6px 12px; border: none; cursor: pointer; border-radius: 4px; margin: 2px; }
        .btn-menu {
            background-color: #34495e; color: white; padding: 10px 20px; font-size: 14px;
            border: none; border-radius: 6px; cursor: pointer;
        }
        .btn-save { background: #27ae60; color: white; width: 100%; padding: 12px; font-size: 16px; margin-top: 15px; }
        .btn-cancel-edit { background: #95a5a6; color: white; width: 100%; padding: 10px; font-size: 14px; margin-top: 6px; display: none; }

        .edit-banner {
            display: none; background: #fff3cd; color: #7a5c00; padding: 8px 12px;
            border-radius: 5px; margin-bottom: 10px; font-size: 14px;
        }

        .image-section { text-align: center; margin: 15px 0; background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #eee; }
        .img-preview { width: 180px; height: 180px; object-fit: cover; border-radius: 10px; display: none; margin: 10px auto; border: 2px solid #34495e; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        
        .video-wrapper {
            width: 100%; max-width: 380px; height: 280px; margin: 10px auto;
            border-radius: 10px; overflow: hidden; border: 2px solid #34495e; background: #000;
            display: none; position: relative;
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform-origin: center center; }

        .zoom-controls {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 10px auto;
            max-width: 360px;
            background: #eef2f7;
            padding: 8px 15px;
            border-radius: 20px;
        }
        .zoom-btn {
            background-color: #2980b9; color: white; border: none; border-radius: 50%;
            width: 32px; height: 32px; font-size: 16px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .zoom-btn:hover { background-color: #1c5980; }
        .zoom-controls input[type="range"] { flex: 1; cursor: pointer; }
        .zoom-value { font-size: 13px; font-weight: bold; width: 45px; text-align: center; }

        .card-scan-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .card-scan-row input#card-id { flex: 1; min-width: 160px; margin: 8px 0; }
        .card-scan-row button { white-space: nowrap; font-size: 13px; padding: 9px 12px; }
        .btn-scan-connect { background: #16a085; color: white; }
        .btn-scan-connect:hover { background: #128a71; }
        .btn-scan-disconnect { background: #e74c3c; color: white; }
        .scan-status { font-size: 12px; color: #888; margin: -4px 0 10px; }
        .scan-status.connected { color: #16a085; font-weight: bold; }
        #card-id.just-scanned { border-color: #16a085; background: #eafaf3; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>
            <span class="role-tag" id="role-tag">بەڕێوەبەر</span>
            <span id="staff-name-label">چاوەڕوانبە...</span>
        </div>
        <div>
            <a href="index.html">🏠 پانێڵی بەڕێوەبەر</a>
            <a href="scanner.html">📡 سکانەر</a>
            <button id="btn-logout">چوونەدەرەوە</button>
        </div>
    </div>

    <div class="page-wrap">
        <div class="container">
            <h2>تۆمارکردن و دەستکاریکردنی قوتابی</h2>
            <div class="edit-banner" id="edit-banner">✏️ لە دۆخی دەستکاریکردنیت بۆ قوتابییەکی هەبوو</div>
            
            <form id="student-form">
                <div class="card-scan-row">
                    <input type="text" id="card-id" placeholder="ژمارەی کارت (RFID)" required>
                    <button type="button" id="btn-scan-connect" class="btn-scan-connect">📡 پەیوەستکردنی کارتخوێن</button>
                    <button type="button" id="btn-scan-disconnect" class="btn-scan-disconnect" style="display:none;">بڕینی پەیوەندی</button>
                </div>
                <div class="scan-status" id="scan-status">کارتخوێن پەیوەست نییە — دەتوانیت ژمارەی کارت بە دەست بنووسیت یان کارتخوێن پەیوەست بکەیت</div>
                
                <input type="text" id="student-name" placeholder="ناوی تەواو" required>
                
                <input type="text" id="student-class" list="class-list" placeholder="پۆل (هەڵبژێرە یان بنووسە)" required autocomplete="off">
                <datalist id="class-list"></datalist>

                <div class="image-section">
                    <label style="display:block; font-weight:bold; margin-bottom:6px;">وێنەی قوتابی:</label>
                    <input type="file" id="student-file" accept="image/*">
                    
                    <div class="video-wrapper" id="video-wrapper">
                        <video id="webcam" autoplay playsinline></video>
                    </div>
                    
                    <div class="zoom-controls" id="zoom-container">
                        <button type="button" class="zoom-btn" id="btn-zoom-out" title="زوم ئاوت">-</button>
                        <input type="range" id="zoom-slider" min="1" max="3" step="0.1" value="1">
                        <button type="button" class="zoom-btn" id="btn-zoom-in" title="زوم ئین">+</button>
                        <span class="zoom-value" id="zoom-val">1.0x</span>
                    </div>

                    <div style="margin-top: 8px;">
                        <button type="button" id="btn-capture" class="btn-menu">کردنەوەی کامێرا</button>
                        <button type="button" id="btn-take-pic" class="btn-menu" style="background-color: #27ae60; display:none;">گرتنی وێنە</button>
                    </div>
                    <canvas id="canvas" style="display:none;"></canvas>
                    
                    <img id="img-preview" class="img-preview" alt="وێنەی پێشبینیکراو">
                </div>

                <button type="submit" class="btn-save">پاشکەوتکردن / نوێکردنەوە</button>
                <button type="button" class="btn-cancel-edit" id="btn-cancel-edit">پاشگەزبوونەوە لە دەستکاریکردن</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { app } from "./firebase-config.js";
        import { requireStaffAuth, logout } from "./auth-guard.js";
        import { 
            getDatabase, ref, set, onValue, remove, update 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const db = getDatabase(app);
        const staff = await requireStaffAuth({ requireAdmin: true });
        
        document.getElementById('staff-name-label').innerText = staff.name;
        document.getElementById('btn-logout').addEventListener('click', logout);

        let capturedImageBase64 = null;
        let editingCardId = null;
        let webcamStream = null;

        // بەشی کۆنترۆڵی کارتخوێن (RFID Serial Port)
        let serialPort = null;
        let serialReader = null;
        let isReadingSerial = false;

        const btnConnect = document.getElementById('btn-scan-connect');
        const btnDisconnect = document.getElementById('btn-scan-disconnect');
        const scanStatus = document.getElementById('scan-status');
        const cardIdInput = document.getElementById('card-id');

        btnConnect.addEventListener('click', async () => {
            if (!("serial" in navigator)) {
                alert("وێبگەڕەکەت پشتگیری لە بەستەرەوەی پۆرتی سریال (Web Serial API) ناکات. تکایە لە Google Chrome یان Edge بەکاری بهێنە.");
                return;
            }
            try {
                serialPort = await navigator.serial.requestPort();
                await serialPort.open({ baudRate: 9600 });
                
                btnConnect.style.display = 'none';
                btnDisconnect.style.display = 'inline-block';
                scanStatus.innerText = 'کارتخوێن بە سەرکەوتوویی پەیوەست بوو — کارتەکە نزیک بکەوە';
                scanStatus.className = 'scan-status connected';

                isReadingSerial = true;
                readSerialData();
            } catch (err) {
                console.error("هەڵە لە پەیوەستکردنی پۆرت:", err);
                alert("نەتوانرا پەیوەست بە کارتخوێن بکرێت: " + err.message);
            }
        });

        btnDisconnect.addEventListener('click', async () => {
            isReadingSerial = false;
            if (serialReader) {
                await serialReader.cancel();
                serialReader = null;
            }
            if (serialPort) {
                await serialPort.close();
                serialPort = null;
            }
            btnConnect.style.display = 'inline-block';
            btnDisconnect.style.display = 'none';
            scanStatus.innerText = 'کارتخوێن پەیوەست نییە — دەتوانیت ژمارەی کارت بە دەست بنووسیت یان کارتخوێن پەیوەست بکەیت';
            scanStatus.className = 'scan-status';
        });

        async function readSerialData() {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = serialPort.readable.pipeTo(textDecoder.writable);
            serialReader = textDecoder.readable.getReader();

            try {
                let buffer = "";
                while (isReadingSerial) {
                    const { value, done } = await serialReader.read();
                    if (done) break;
                    if (value) {
                        buffer += value;
                        if (buffer.includes("\n") || buffer.includes("\r")) {
                            let cardId = buffer.trim();
                            if (cardId.length > 0) {
                                cardIdInput.value = cardId;
                                cardIdInput.classList.add('just-scanned');
                                setTimeout(() => cardIdInput.classList.remove('just-scanned'), 1500);
                            }
                            buffer = "";
                        }
                    }
                }
            } catch (error) {
                console.log("پەیوەندی پۆرت پچڕا:", error);
            } finally {
                if (serialReader) serialReader.releaseLock();
            }
        }

        // بەشی کامێرا و زوم
        const btnCapture = document.getElementById('btn-capture');
        const btnTakePic = document.getElementById('btn-take-pic');
        const videoWrapper = document.getElementById('video-wrapper');
        const video = document.getElementById('webcam');
        const zoomContainer = document.getElementById('zoom-container');
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomValDisplay = document.getElementById('zoom-val');
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');

        btnCapture.addEventListener('click', startWebcam);
        btnTakePic.addEventListener('click', takeSnapshot);

        async function startWebcam() {
            btnTakePic.style.display = 'inline-block';
            zoomContainer.style.display = 'flex';
            videoWrapper.style.display = 'block';
            try {
                webcamStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = webcamStream;
            } catch (e) {
                alert("نەتوانرا کامێرا بکرێتەوە: " + e.message);
            }
        }

        function updateZoom(val) {
            let zoomVal = parseFloat(val);
            if (zoomVal < 1) zoomVal = 1;
            if (zoomVal > 3) zoomVal = 3;

            zoomSlider.value = zoomVal;
            zoomValDisplay.innerText = zoomVal.toFixed(1) + 'x';
            video.style.transform = `scale(${zoomVal})`;
        }

        zoomSlider.oninput = (e) => updateZoom(e.target.value);
        
        btnZoomIn.onclick = () => {
            let current = parseFloat(zoomSlider.value);
            updateZoom(current + 0.2);
        };

        btnZoomOut.onclick = () => {
            let current = parseFloat(zoomSlider.value);
            updateZoom(current - 0.2);
        };

        function takeSnapshot() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            capturedImageBase64 = canvas.toDataURL('image/jpeg');
            showPreview(capturedImageBase64);
            stopWebcam();
        }

        function stopWebcam() {
            if (webcamStream) {
                webcamStream.getTracks().forEach(t => t.stop());
                webcamStream = null;
            }
            videoWrapper.style.display = 'none';
            btnTakePic.style.display = 'none';
            zoomContainer.style.display = 'none';
            updateZoom(1);
        }

        function showPreview(src) {
            const img = document.getElementById('img-preview');
            img.src = src;
            img.style.display = 'block';
        }

        onValue(ref(db, 'students'), (snapshot) => {
            const classSet = new Set();
            if (snapshot.exists()) {
                const data = snapshot.val();
                Object.values(data).forEach(st => {
                    if (st.class && st.class.trim() !== '') {
                        classSet.add(st.class.trim());
                    }
                });
            }
            populateClassDatalist(Array.from(classSet));
        });

        function populateClassDatalist(classList) {
            const datalist = document.getElementById('class-list');
            datalist.innerHTML = '';
            classList.sort().forEach(cls => {
                const option = document.createElement('option');
                option.value = cls;
                datalist.appendChild(option);
            });
        }

        function resetFormKeepClass() {
            const currentClass = document.getElementById('student-class').value;
            editingCardId = null;
            
            document.getElementById('card-id').value = '';
            document.getElementById('student-name').value = '';
            document.getElementById('student-file').value = '';
            
            document.getElementById('student-class').value = currentClass;
            document.getElementById('card-id').disabled = false;
            document.getElementById('edit-banner').style.display = 'none';
            document.getElementById('btn-cancel-edit').style.display = 'none';
            document.getElementById('img-preview').style.display = 'none';
            capturedImageBase64 = null;
            stopWebcam();
        }

        document.getElementById('btn-cancel-edit').addEventListener('click', resetFormKeepClass);

        document.getElementById('student-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const cardId = document.getElementById('card-id').value.trim();
            const name = document.getElementById('student-name').value.trim();
            const cls = document.getElementById('student-class').value.trim();
            const fileInput = document.getElementById('student-file');

            let photoData = capturedImageBase64;

            if (!photoData && fileInput.files.length > 0) {
                photoData = await new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(fileInput.files[0]);
                });
            }

            const updates = {
                name: name,
                class: cls
            };

            if (photoData) updates.photo = photoData;

            if (editingCardId) {
                await update(ref(db, `students/${editingCardId}`), updates);
            } else {
                if (!photoData) updates.photo = "";
                await set(ref(db, `students/${cardId}`), updates);
            }

            resetFormKeepClass();
            alert("بە سەرکەوتوویی تۆمارکرا!");
        });
    </script>
</body>
</html>
